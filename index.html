<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Angel Tambe · Computer Science & Engineering Student</title>
<meta name="description" content="Portfolio of Angel Tambe, a second-year B.Tech Computer Science and Engineering student at KIT's College of Engineering, Kolhapur.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23183153'/%3E%3Ctext x='32' y='41' font-family='Arial' font-size='26' font-weight='700' fill='white' text-anchor='middle'%3EAT%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#F8F9FB;--sf:#fff;--hd:#183153;--on:#fff;--bl:#315B8C;--tx:#202938;--mu:#667085;--bd:#E2E7EE;--pl:#EAF0F7;--r:14px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1622;--sf:#152033;--hd:#A9C3E8;--on:#0E1622;--bl:#8DB0E0;--tx:#E6EBF2;--mu:#9AA6B8;--bd:#26344A;--pl:#1B2A42}}
:root[data-theme="dark"]{--bg:#0E1622;--sf:#152033;--hd:#A9C3E8;--on:#0E1622;--bl:#8DB0E0;--tx:#E6EBF2;--mu:#9AA6B8;--bd:#26344A;--pl:#1B2A42}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:400 1rem/1.65 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--bl)}
:focus-visible{outline:2px solid var(--bl);outline-offset:3px;border-radius:6px}
.w{max-width:1120px;margin:0 auto;padding:0 24px}
section{padding:88px 0}
.ey{font-size:.75rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--bl);margin:0 0 12px}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(2.5rem,6vw,4.1rem);line-height:1.05;font-weight:600;letter-spacing:-.025em;color:var(--hd)}
h2{font-size:clamp(1.65rem,3.4vw,2.4rem);line-height:1.2;font-weight:500;letter-spacing:-.015em;color:var(--hd);margin-bottom:36px}
h3{font-size:1.05rem;font-weight:600;color:var(--hd);line-height:1.35}
.mu{color:var(--mu)}
/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
.nb{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{font-weight:600;font-size:1.15rem;color:var(--hd);text-decoration:none;letter-spacing:-.01em}
.nb ul{display:flex;align-items:center;gap:6px;list-style:none;margin:0;padding:0}
.nb li a{display:block;padding:8px 12px;border-radius:8px;color:var(--mu);text-decoration:none;font-size:.92rem;font-weight:500;transition:color .2s,background .2s}
.nb li a:hover,.nb li a[aria-current]{color:var(--hd);background:var(--pl)}
.btn{display:inline-block;padding:12px 22px;border-radius:10px;font-weight:500;font-size:.95rem;text-decoration:none;border:1px solid var(--hd);background:var(--hd);color:var(--on);cursor:pointer;font-family:inherit;transition:transform .2s,background .2s,color .2s}
.btn:hover{transform:translateY(-1px)}
.btn.o{background:transparent;color:var(--hd)}
.btn.o:hover{background:var(--pl)}
.nb li a.btn{padding:9px 16px;color:var(--on);background:var(--hd);margin-left:8px}
.mt{display:none;background:none;border:1px solid var(--bd);border-radius:8px;width:44px;height:44px;color:var(--hd);cursor:pointer}
/* hero */
#home{padding:72px 0 40px}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center}
.hero .sub{font-size:1.3rem;color:var(--bl);font-weight:500;margin:18px 0 16px;line-height:1.35}
.hero .in{max-width:520px;color:var(--mu)}
.bt{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0 22px}
.af{font-size:.88rem;color:var(--mu);padding-top:18px;border-top:1px solid var(--bd);max-width:520px}
.pt{margin:0;justify-self:end;width:100%;max-width:400px;aspect-ratio:4/5;border-radius:18px;overflow:hidden;border:1px solid var(--bd);background:var(--pl);box-shadow:0 18px 40px -22px rgba(24,49,83,.35)}
.pt img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 30%}
.pt.ph{display:grid;place-items:center;color:var(--mu);font-size:.9rem}
/* cards & grids */
.c{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:26px;transition:border-color .2s,transform .2s,box-shadow .2s}
.c:hover{border-color:var(--bl);transform:translateY(-2px);box-shadow:0 10px 26px -14px rgba(24,49,83,.3)}
.g{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}
.c.pl{background:var(--pl)}
.c.nv{background:var(--hd);border-color:var(--hd)}
.c.nv h3,.c.nv .big,.c.nv p,.c.nv .ey{color:var(--on)}
.c.nv .ey{opacity:.75}
.big{font-size:2.6rem;line-height:1.1;font-weight:600;color:var(--hd);letter-spacing:-.02em;margin:10px 0 2px}
.c p+p,.c h3+p{margin-top:8px}
.c p{font-size:.95rem;color:var(--mu)}
.chip{display:inline-block;padding:5px 12px;border:1px solid var(--bd);border-radius:999px;background:var(--pl);color:var(--hd);font-size:.88rem;font-weight:500;margin:0 8px 8px 0}
.c.pl .chip{background:var(--sf)}
.tag{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--bl);margin-bottom:10px;display:block}
/* about */
.ab{display:grid;grid-template-columns:1.4fr .8fr;gap:48px;align-items:start}
.ab p{color:var(--mu);margin-bottom:16px;max-width:620px}
dl{margin:14px 0 0}dt{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--bl);font-weight:600;margin-top:14px}dd{margin:2px 0 0;color:var(--tx);font-size:.95rem}
/* skills */
.sk{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
/* timeline */
.tl{border-left:1px solid var(--bd);margin-left:6px;padding-left:28px;display:grid;gap:16px}
.tl .c{position:relative}
.tl .c::before{content:"";position:absolute;left:-35px;top:30px;width:11px;height:11px;border-radius:50%;background:var(--sf);border:2px solid var(--bl)}
.tl p.sd{color:var(--tx)}
/* projects */
.pj{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.pj .c img{width:100%;border-radius:10px;margin-bottom:14px}
.ln{display:flex;gap:14px;margin-top:14px;font-size:.92rem;font-weight:500}
.em{border-style:dashed;background:transparent}
/* contact */
.ct{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.ct p.mu{max-width:440px}
.cl{display:grid;gap:12px}
.cl .c{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px 22px}
.cl .l{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--bl);font-weight:600}
.cl a.v{display:block;font-weight:500;color:var(--hd);text-decoration:none;word-break:break-all}
.cl a.v:hover{text-decoration:underline}
.btn.s{padding:9px 14px;font-size:.85rem}
#st{font-size:.85rem;color:var(--mu);min-height:1.3em}
footer{border-top:1px solid var(--bd);padding:32px 0}
.ft{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--mu)}
.ft strong{color:var(--hd);font-weight:600;display:block}
.ft nav{display:flex;gap:20px}
/* motion */
.js .rv{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
.js .rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.js .rv{opacity:1!important;transform:none!important;transition:none}.c,.btn{transition:none}.c:hover,.btn:hover{transform:none}}
/* responsive */
@media (max-width:860px){
 section{padding:64px 0}
 .hero,.ab,.ct{grid-template-columns:1fr;gap:36px}
 .pt{justify-self:start;max-width:340px}
 .g{grid-template-columns:1fr}.s2,.s3,.s4{grid-column:auto}
 .sk,.pj{grid-template-columns:1fr}
 .mt{display:inline-grid;place-items:center}
 .nb ul{display:none;position:absolute;top:68px;left:0;right:0;flex-direction:column;align-items:stretch;background:var(--bg);border-bottom:1px solid var(--bd);padding:10px 24px 18px}
 .nb ul.open{display:flex}
 .nb li a{padding:13px 12px}
 .nb li a.btn{margin:8px 0 0;text-align:center}
 header{position:sticky}
 .nb{position:relative}
}
</style>
</head>

/* ===== Components ===== */
const ext = 'target="_blank" rel="noopener noreferrer"';
const NAV = [["Home","home"],["About","about"],["Skills","skills"],["Experience","experience"],["Achievements","achievements"],["Contact","contact"]];
const chips = a => a.map(x => `<span class="chip">${x}</span>`).join("");

const Navbar = () => NAV.map(([n,id]) => `<li><a href="#${id}">${n}</a></li>`).join("") + `<li><a class="btn" href="#contact">Let's Connect</a></li>`;

const Hero = () => `<section id="home" aria-labelledby="h1"><div class="w hero">
<div class="rv"><p class="ey">Computer Science &amp; Engineering</p>
<h1 id="h1">Hi, I'm Angel Tambe.</h1>
<p class="sub">Learning technology. Exploring ideas. Building my path.</p>
<p class="in">I'm a second-year Computer Science and Engineering student at KIT's College of Engineering, Kolhapur, developing my technical foundation while exploring innovation, communication, and collaborative problem-solving.</p>
<div class="bt"><a class="btn" href="#experience">Explore My Work</a><a class="btn o" href="#contact">Connect With Me</a></div>
<p class="af">B.Tech CSE · KIT's College of Engineering, Kolhapur</p></div>
${D.portrait && !D.portrait.startsWith("__")
  ? `<figure class="pt rv"><img src="${D.portrait}" alt="${D.portraitAlt}" width="560" height="700"></figure>`
  : `<div class="pt ph rv" role="img" aria-label="Portrait placeholder">Add your portrait</div>`}
</div></section>`;

const BentoCard = (cls, inner) => `<article class="c ${cls} rv">${inner}</article>`;
const Bento = () => `<section aria-labelledby="jt" style="padding-top:40px"><div class="w"><p class="ey">Highlights</p><h2 id="jt">A little about my journey</h2><div class="g">
${BentoCard("s2 pl", `<span class="tag">Education</span><h3>Academic Foundation</h3><p class="big">7.74</p><p>First-year CGPA</p><p>B.Tech Computer Science and Engineering, KIT's College of Engineering, Kolhapur.</p>`)}
${BentoCard("s4", `<span class="tag">Technical skills</span><h3>Technical Foundation</h3><p style="margin:14px 0 4px">${chips(["C","Python","HTML","CSS","Data Structures"])}</p><p>Building a foundation in programming, web basics, and core computer science concepts.</p>`)}
${BentoCard("s3 nv", `<span class="tag" style="color:var(--on);opacity:.75">Achievement</span><h3>Model United Nations</h3><p class="big" style="font-size:1.9rem">High Commendation</p><p>Recognition received for the second time. Reported placement: third position.</p>`)}
${BentoCard("s3", `<span class="tag">Innovation</span><h3>Exploring Ideas</h3><p>Startup idea pitching and participation in hackathons have given me opportunities to explore innovation and collaborative problem-solving.</p>`)}
</div></div></section>`;

const About = () => `<section id="about" aria-labelledby="ah"><div class="w ab"><div class="rv"><p class="ey">About me</p><h2 id="ah">Curious by nature, learning by doing.</h2>
<p>I'm a second-year Computer Science and Engineering student, building my programming and computer science fundamentals one concept at a time.</p>
<p>Along the way, I've explored startup idea pitching and hackathon environments, and taken part in Model United Nations, group discussions, and interviews. I've also anchored a national-level college event through E-Cell.</p>
<p>I enjoy opportunities that help me learn, communicate, collaborate, and grow professionally.</p></div>
<aside class="c pl rv" aria-label="Education summary"><span class="tag">Education</span><h3>B.Tech in Computer Science and Engineering</h3>
<dl><dt>Institution</dt><dd>KIT's College of Engineering, Kolhapur</dd><dt>First-year CGPA</dt><dd>7.74</dd><dt>Current academic year</dt><dd>Second Year</dd></dl></aside></div></section>`;

const Skills = () => `<section id="skills" aria-labelledby="sh" style="padding-top:24px"><div class="w"><p class="ey">Technical foundation</p><h2 id="sh">Skills I'm building.</h2><div class="sk">
${D.skills.map(s => `<div class="c rv"><span class="tag">${s.g}</span><div style="margin-top:12px">${chips(s.i)}</div></div>`).join("")}</div></div></section>`;

const ExperienceCard = e => `<article class="c rv"><h3>${e.t}</h3><p>${e.d}</p>${e.s ? `<p class="sd">${e.s}</p>` : ""}</article>`;
const Experience = () => `<section id="experience" aria-labelledby="eh"><div class="w"><p class="ey">Experience &amp; involvement</p><h2 id="eh">Learning beyond the classroom.</h2><div class="tl">${D.experience.map(ExperienceCard).join("")}</div></div></section>`;

const AchievementCard = a => `<article class="c ${a.cls} rv"><span class="tag">${a.tag}</span><h3>${a.t}</h3>${a.hl ? `<p style="color:var(--tx);font-weight:500;margin-top:8px">${a.hl}</p>` : ""}<p>${a.d}</p></article>`;
const Achievements = () => `<section id="achievements" aria-labelledby="gh" style="padding-top:24px"><div class="w"><p class="ey">Achievements</p><h2 id="gh">Experiences that have helped me grow.</h2><div class="g">${D.achievements.map(AchievementCard).join("")}</div></div></section>`;

const ProjectCard = p => `<article class="c rv">${p.image ? `<img src="${p.image}" alt="${p.title} screenshot">` : ""}${p.category ? `<span class="tag">${p.category}</span>` : ""}<h3>${p.title}</h3>${p.problem ? `<p><strong>Problem:</strong> ${p.problem}</p>` : ""}${p.summary ? `<p>${p.summary}</p>` : ""}${p.contribution ? `<p><strong>My contribution:</strong> ${p.contribution}</p>` : ""}${p.tech && p.tech.length ? `<p style="margin-top:12px">${chips(p.tech)}</p>` : ""}${p.github || p.demo ? `<div class="ln">${p.github ? `<a href="${p.github}" ${ext}>GitHub</a>` : ""}${p.demo ? `<a href="${p.demo}" ${ext}>Live demo</a>` : ""}</div>` : ""}</article>`;
const Projects = () => `<section id="projects" aria-labelledby="ph" style="padding-top:24px"><div class="w"><p class="ey">Case study</p><h2 id="ph">Projects &amp; Work</h2><div class="pj">${D.projects.map(ProjectCard).join("")}
<div class="c em rv"><h3>More projects coming soon</h3><p>This section will showcase future technical projects, my contribution, technologies used, and working demos.</p></div></div></div></section>`;

const Contact = () => `<section id="contact" aria-labelledby="ch"><div class="w ct"><div class="rv"><p class="ey">Get in touch</p><h2 id="ch" style="margin-bottom:16px">Let's connect.</h2><p class="mu">Interested in connecting, collaborating, or exchanging ideas? Feel free to reach out.</p></div>
<div class="cl rv"><div class="c"><div><span class="l">Email</span><a class="v" href="mailto:${D.email}">${D.email}</a></div><button class="btn o s" id="cp" type="button">Copy email</button></div>
<div class="c"><div><span class="l">LinkedIn</span><a class="v" href="${D.linkedin}" ${ext}>Connect on LinkedIn</a></div></div>
<p id="st" role="status" aria-live="polite"></p></div></div></section>`;

const Footer = () => `<div class="w ft"><div><strong>${D.name}</strong>Computer Science &amp; Engineering Student<div style="margin-top:6px">© ${new Date().getFullYear()}</div></div><nav aria-label="Footer"><a href="mailto:${D.email}">Email</a><a href="${D.linkedin}" ${ext}>LinkedIn</a></nav></div>`;

/* ===== Mount ===== */
document.documentElement.classList.add("js");
document.getElementById("nl").innerHTML = Navbar();
document.getElementById("app").innerHTML = [Hero,Bento,About,Skills,Experience,Achievements,Projects,Contact].map(f => f()).join("");
document.getElementById("ftr").innerHTML = Footer();

const mt = document.getElementById("mt"), nl = document.getElementById("nl");
const setMenu = o => { nl.classList.toggle("open", o); mt.setAttribute("aria-expanded", o); };
mt.addEventListener("click", () => setMenu(!nl.classList.contains("open")));
nl.addEventListener("click", e => { if (e.target.closest("a")) setMenu(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape") setMenu(false); });

document.getElementById("cp").addEventListener("click", async () => {
  const st = document.getElementById("st");
  try { await navigator.clipboard.writeText(D.email); st.textContent = "Email address copied."; }
  catch (e) { st.textContent = "Copy isn't available here. Please select the address above."; }
});

if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .12 });
  document.querySelectorAll(".rv").forEach(el => io.observe(el));
  const links = [...nl.querySelectorAll("a[href^='#']:not(.btn)")];
  const so = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) links.forEach(a => a.getAttribute("href") === "#" + e.target.id ? a.setAttribute("aria-current", "true") : a.removeAttribute("aria-current"));
  }), { rootMargin: "-40% 0px -55% 0px" });
  NAV.forEach(([, id]) => so.observe(document.getElementById(id)));
} else document.querySelectorAll(".rv").forEach(el => el.classList.add("in"));
</script>
</body>
</html>
